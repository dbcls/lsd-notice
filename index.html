<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lsd-project.org でのライフサイエンス辞書サービス終了のお知らせ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a2333;
      --paper: #f0f4f8;
      --accent: #1a5c9e;
      --muted: #4a5a6e;
      --rule: #b0c4d8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 背景 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(26,92,158,0.05) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(26,92,158,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ノイズオーバーレイ */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      pointer-events: none;
      opacity: 0.6;
    }

    .frame {
      position: fixed;
      inset: 24px;
      border: 1px solid var(--rule);
      pointer-events: none;
      animation: fadeIn 1.2s ease forwards;
      opacity: 0;
    }

    .frame::before, .frame::after {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(200,191,176,0.4);
    }

    .frame::after {
      inset: 8px;
      border-color: rgba(200,191,176,0.2);
    }

    /* 四隅の装飾 */
    .corner {
      position: fixed;
      width: 20px;
      height: 20px;
      opacity: 0;
      animation: fadeIn 1.4s ease 0.3s forwards;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: var(--rule);
    }
    .corner::before { width: 100%; height: 1px; top: 0; left: 0; }
    .corner::after  { width: 1px; height: 100%; top: 0; left: 0; }

    .corner-tl { top: 24px; left: 24px; }
    .corner-tr { top: 24px; right: 24px; transform: scaleX(-1); }
    .corner-bl { bottom: 24px; left: 24px; transform: scaleY(-1); }
    .corner-br { bottom: 24px; right: 24px; transform: scale(-1); }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 640px;
      width: 90%;
      padding: 64px 48px 56px;
      opacity: 0;
      animation: riseIn 1s ease 0.5s forwards;
    }

    .stamp {
      display: inline-block;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-family: 'Shippori Mincho', serif;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      padding: 5px 14px;
      margin-bottom: 40px;
      opacity: 0.85;
      position: relative;
    }
    .stamp::before {
      content: '';
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(26,92,158,0.25);
    }

    .rule-top {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--rule) 20%, var(--rule) 80%, transparent);
      margin-bottom: 48px;
    }

    h1 {
      font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
      font-weight: 600;
      font-size: clamp(1.1rem, 3vw, 1.35rem);
      letter-spacing: 0.18em;
      line-height: 2.2;
      color: var(--ink);
      margin-bottom: 36px;
    }

    .body-text {
      font-weight: 300;
      font-size: clamp(0.82rem, 2vw, 0.92rem);
      letter-spacing: 0.1em;
      line-height: 2.4;
      color: var(--muted);
      margin-bottom: 48px;
    }

    .url-section {
      margin-bottom: 48px;
    }

    .url-label {
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      color: var(--muted);
      margin-bottom: 14px;
      opacity: 0.7;
    }

    .url-link {
      display: inline-block;
      font-family: 'Shippori Mincho', serif;
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      letter-spacing: 0.06em;
      color: var(--accent);
      text-decoration: none;
      padding: 14px 28px;
      border: 1px solid var(--accent);
      position: relative;
      transition: all 0.3s ease;
      background-color: #f5f0e8;
    }

    .url-link::before {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(26,92,158,0.2);
      transition: all 0.3s ease;
    }

    .url-link:hover {
      background: var(--accent);
      color: var(--paper);
    }

    .url-link:hover .tld-new {
      color: var(--paper);
      background: transparent;
    }

    .url-link:hover::before {
      border-color: rgba(240,244,248,0.3);
    }
    /* .jp 部分の強調 */
    .tld-new {
      color: var(--accent);
      font-weight: 600;
      font-size: 1.15em;
      padding: 0 1px;
      position: relative;
      transition: color 0.3s ease;
    }

    .rule-bottom {
      width: 60%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--rule), transparent);
      margin: 0 auto 32px;
    }

    .footer-note {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      opacity: 0.55;
    }

    /* 縦線の装飾 */
    .vline {
      position: fixed;
      top: 48px;
      bottom: 48px;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--rule) 20%, var(--rule) 80%, transparent);
      opacity: 0.35;
      pointer-events: none;
    }
    .vline-l { left: 48px; }
    .vline-r { right: 48px; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .card { padding: 48px 28px 40px; }
      .frame { inset: 12px; }
      .vline { display: none; }
    }
  </style>
</head>
<body>

  <div class="frame"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="vline vline-l"></div>
  <div class="vline vline-r"></div>

  <div class="card">
    <div class="stamp">お知らせ</div>

    <div class="rule-top"></div>

    <h1>lsd-project.org でのライフサイエンス辞書サービス終了のお知らせ</h1>

    <p class="body-text">
      本ドメインでのライフサイエンス辞書サービスは<br>
      提供を終了しました。<br>
      <br>
      引き続きご利用いただくには<br>
      以下の新しいURLへお進みください。<br>
      (ドメイン名の最後の .org が .jp になります。)
    </p>

    <div class="url-section">
      <p class="url-label">新しいURL</p>
      <a class="url-link" href="https://lsd-project.jp/">https://lsd-project<span class="tld-new">.jp</span>/</a>
    </div>

    <div class="rule-bottom"></div>

    <p class="footer-note">引き続き、ライフサイエンス辞書のご利用をよろしくお願いいたします。</p>
  </div>

</body>
</html>
